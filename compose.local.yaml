name: socratia-local
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: socratia-local-db
    labels:
      socratia.purpose: local-development
    environment:
      POSTGRES_DB: socratia
      POSTGRES_USER: socratia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socratia_dev_password}
    ports: ["127.0.0.1:5436:5432"]
    volumes: [local_database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U socratia -d socratia"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  local_database:
